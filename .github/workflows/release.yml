name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Build
        run: pnpm build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 🌐 وبسایت و دموی زنده آنلاین (Live Web App)
            شما می‌توانید این استودیو را به صورت آنلاین و بدون نیاز به نصب روی مرورگر خود تجربه کنید:
            👉 **[https://mohsnraj.github.io/RtlMarkdown](https://mohsnraj.github.io/RtlMarkdown)**

            ---
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
